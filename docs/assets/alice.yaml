cv:
  name: Alice Morgan
  photo: alice-portrait.png
  headline: Staff platform engineer · reliable systems, thoughtful teams
  location: Bristol, United Kingdom
  email: alice.morgan@example.com
  website: https://example.com/alice
  custom_connections:
  - fontawesome_icon: book
    placeholder: Engineering notebook
    url: https://example.com/alice/notes
  sections:
    summary:
    - I turn growing software platforms into systems that teams can understand and operate. My work 
      joins hands-on engineering, pragmatic architecture and patient mentoring. I care about useful 
      defaults, clear ownership and the experience of the person on call.
    experience:
    - company: Northstar Atlas
      position: Staff platform engineer
      start_date: 2023-03
      end_date: present
      location: Bristol · hybrid
      summary: A fictional mapping software company supporting research teams and civic services. 
        Led the platform group as the product grew from a regional service into a shared service for
        twelve partner organisations.
      highlights:
      - Replaced a single shared release window with independently deployable services, reducing the
        median time from a reviewed change to production from two days to forty minutes.
      - Designed a versioned ingestion API with idempotent writes and explicit retry behaviour. 
        Worked with partner engineers to migrate each client without a coordinated cutover.
      - Introduced service ownership, measurable reliability goals and short incident reviews. The 
        approach gave product teams a common language for choosing between new work and operational 
        improvements.
      - Built a small paved road for deployments, secrets and observability. Kept the underlying 
        tools accessible so teams could investigate failures without waiting for platform support.
      - Coached six engineers through design reviews and production investigations; rotated 
        facilitation so knowledge and decision-making did not depend on a single person.
      tags: Python · PostgreSQL · Kubernetes · OpenTelemetry
    - company: Cedar Post
      position: Senior software engineer
      start_date: 2020-02
      end_date: 2023-02
      location: Remote
      summary: Built dispatch and tracking tools for a fictional cooperative of independent delivery
        services. Owned the data path from mobile updates to customer-facing tracking.
      highlights:
      - Split a fragile nightly import into resumable stages with a visible progress log. Operators 
        could replay a failed stage without reprocessing successful deliveries.
      - Added contract tests and consumer-driven migration plans around the public tracking API, 
        then removed obsolete endpoints once every active client had moved.
      - Reworked the operations dashboard with dispatchers during weekly observation sessions. Made 
        delays, stale device updates and missing addresses visible before a customer called.
      - Documented recovery procedures as executable commands with expected output. A new engineer 
        could restore the staging service and explain what each step protected.
      tags: Go · Redis · event processing · accessible interfaces
    - company: Meadow Instruments
      position: Software engineer
      start_date: 2017-07
      end_date: 2020-01
      location: Bath, United Kingdom
      summary: Developed a fictional laboratory scheduling product with a small multidisciplinary 
        team.
      highlights:
      - Implemented a reservation service that accounted for equipment maintenance and shared 
        preparation time, with explicit validation of conflicting bookings.
      - Added audit history and a read-only export for laboratory coordinators. Clear error messages
        reduced support requests around incomplete booking forms.
      - Paired with the support team to turn recurring reports into regression tests and concise 
        troubleshooting notes.
      tags: TypeScript · Python · SQL
    education:
    - institution: Westbridge Institute of Technology
      area: Computer Science
      degree: MSc
      start_date: 2015-09
      end_date: 2017-06
