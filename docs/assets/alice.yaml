    skills:
    - label: Systems
      details: Python, Go, PostgreSQL, Kubernetes, eBPF, OpenTelemetry, Redis
    - label: Practice
      details: API design, incident analysis, incremental migration, technical writing, contract 
        testing, release planning
    - label: Reliability
      details: Service objectives, Recovery exercises, Capacity planning, Alert design, Runbook 
        writing, Failure analysis
    - label: Collaboration
      details: Design reviews, Pair programming, Workshop facilitation, Decision records, Knowledge 
        sharing, Team onboarding
    - label: Strengths
      details: patient mentoring, clear communication, calm decision-making, thoughtful feedback, 
        shared ownership
    languages:
    - label: English
      details: Native
    - label: French
      details: Professional working proficiency
    projects:
    - name: Harbour observability handbook
      start_date: 2025-01
      end_date: present
      summary: A fictional community guide for teams establishing their first on-call rotation
      highlights:
      - Wrote runnable examples that connect user-visible symptoms to logs, traces and service 
        metrics. Each chapter ends with a short investigation rather than a list of product 
        features.
      - Tested the handbook with volunteer maintainers and revised the examples around the decisions
        readers found hardest to make.
      tags: Open documentation · mentoring
    - name: Community repair weekend
      start_date: '2024-05-04'
      end_date: '2024-05-18'
      summary: A two-week volunteer programme coordinating repairs and sharing practical maintenance
        skills
      highlights:
      - Built a lightweight intake board with clear repair status, printable labels and an 
        accessible public view.
    selected_writing:
    - name: Make recovery a normal operation
      date: 2026-04
      summary: A fictional essay on testing restoration before an incident
      highlights:
      - Explains why a small rehearsed recovery procedure can be more useful than a long document 
        that has never been run. Includes a checklist for ownership, required access and 
        verification.
    - name: The smallest useful platform
      date: 2025-09
      summary: A fictional conference session about choosing a narrow platform scope
      highlights:
      - Uses a case study to show how an internal platform can standardise routine work while 
        preserving a clear escape hatch for unusual workloads.
